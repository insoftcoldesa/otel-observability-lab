# Loki — modo monolitico (single binary), suficiente para el laboratorio.
# En produccion se despliega en microservicios; aqui eso solo anadiria
# contenedores sin aportar nada a la rubrica.

auth_enabled: false          # sin multi-tenancy: un solo inquilino local

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn            # info inunda el log con cada peticion de Grafana

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1      # una sola replica: no hay alta disponibilidad
  ring:
    kvstore:
      store: inmemory        # el anillo vive en memoria, no hace falta etcd

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13            # v13 es el que soporta structured metadata
      index:
        prefix: index_
        period: 24h

limits_config:
  # ESTA LINEA ES LA QUE HABILITA LA CORRELACION.
  # El Collector manda trace_id como structured metadata (no como etiqueta de
  # stream, que dispararia la cardinalidad). Sin allow_structured_metadata,
  # Loki descarta ese campo y el salto log -> traza de la Fase 3 no existe.
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 72h      # 3 dias: es un laboratorio, no un archivo historico
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20

ruler:
  alertmanager_url: http://localhost:9093

# Sin telemetria hacia Grafana Labs: es un laboratorio academico.
analytics:
  reporting_enabled: false
