# Compose minimo de la Fase 1: solo PostgreSQL, para validar T1.1–T1.3 corriendo
# los servicios en local con uv. El compose completo de 8 contenedores llega en T2.5.
#   docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: otel-lab-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
      POSTGRES_USER: ${POSTGRES_USER:-otel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-otel_lab_2026}
    ports:
      # 15432 por defecto: la maquina de Fredy ya tiene PostgreSQL escuchando en
      # 5432–5434. Dentro de la red de Docker el puerto siempre es 5432.
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - ./services/service-b/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-otel} -d ${POSTGRES_DB:-inventory}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
